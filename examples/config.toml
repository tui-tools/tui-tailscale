# tui-tailscale configuration.
#
# Read from /etc/tui-tailscale/config.toml first, then
# ~/.config/tui-tailscale/config.toml, with the user file overriding the
# machine-wide one. TUI_TAILSCALE_* environment variables override both, and
# command line flags override everything.

# Privilege escalation prefix used for every change to the node, and for a
# read tailscaled refuses to this user; "" runs the commands directly (as
# root, or as a user set with `tailscale set --operator`).
sudo = "sudo -n"

# Path to an Omarchy-style colors.toml. Empty follows the active Omarchy
# theme when present, and falls back to the built-in Tokyo Night palette.
theme = ""

# Every key can also be set in the environment, upper-cased and prefixed:
#   TUI_TAILSCALE_SUDO="doas"
